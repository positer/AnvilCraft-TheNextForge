plugins {
    id 'java-library'
    id 'idea'
    alias libs.plugins.modDevGradle
}

version = "${mod_version}"
group = maven_group

apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/dependencies.gradle"

java.toolchain.languageVersion = JavaLanguageVersion.of(java_version)

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 测试与验证用的类只在开发环境编译运行，发行包里不带这些类
tasks.named('jar') {
    exclude 'dev/anvilcraft/thenextforge/gametest/**'
    manifest {
        // mods.toml 的 version 是 ${file.jarVersion}，由清单里的 Implementation-Version 提供
        attributes('Implementation-Version': project.version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 独立附属源码只依赖发行 JAR，防止示例意外依赖 main 输出或开发测试类。
tasks.register('compileApiExample', JavaCompile) {
    dependsOn tasks.named('jar')
    source fileTree("$rootDir/../examples/api-addon-26.1.2") { include '**/*.java' }
    classpath = files(tasks.named('jar').flatMap { it.archiveFile }) + configurations.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('api-example-classes')
    javaCompiler = javaToolchains.compilerFor { languageVersion = java.toolchain.languageVersion }
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
