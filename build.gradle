plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    alias libs.plugins.modDevGradle
    alias libs.plugins.lombok
}

String buildType
String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
String buildTypeEnv = System.getenv("BUILD_TYPE")
if (buildTypeEnv == "pr") {
    buildType = 'pr'
} else if (buildTypeEnv == "hotfix") {
    buildType = 'hotfix'
} else if (buildTypeEnv == "snapshot") {
    buildType = 'snapshot'
} else if (buildTypeEnv == "release") {
    buildType = null
    buildNumber = null
} else {
    buildType = 'build'
}
def githubRef = System.getenv("GITHUB_REF")
if (githubRef != null && githubRef.startsWith("refs/tags/")) {
    version = githubRef.substring(githubRef.lastIndexOf('/') + 1)
} else {
    version = "${mod_version}" + (buildNumber != null ? "+${buildType}.${buildNumber}" : "")
}
group = maven_group

apply from: "$rootDir/gradle/scripts/moddevgradle.gradle"
apply from: "$rootDir/gradle/scripts/repositories.gradle"
apply from: "$rootDir/gradle/scripts/jars.gradle"
apply from: "$rootDir/gradle/scripts/publishing.gradle"
apply from: "$rootDir/gradle/scripts/resources.gradle"
apply from: "$rootDir/dependencies.gradle"

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

// 测试与验证用的类只在开发环境编译运行，发行包里不带这些类
tasks.named('jar') {
    exclude 'dev/anvilcraft/thenextforge/gametest/**'
    exclude 'data/thenextforge_api_probe/**'
    exclude 'dev/anvilcraft/thenextforge/command/**'
    exclude 'dev/anvilcraft/thenextforge/event/ForgeDebugDump.class'
    exclude 'dev/anvilcraft/thenextforge/event/ForgeDebugDump$*.class'
    exclude 'dev/anvilcraft/thenextforge/event/AutomationTestPump.class'
    exclude 'dev/anvilcraft/thenextforge/event/AutomationTestPump$*.class'
}

// Windows 简体中文环境默认 GBK，会把手写中文注释/字符串读成乱码；源码与 delombok 统一按 UTF-8 处理
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
tasks.named('delombok').configure {
    encoding = 'UTF-8'
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

lombok {
    version = "1.18.34"
}

// 独立附属源码只依赖发行 JAR，防止示例意外依赖 main 输出或开发测试类。
tasks.register('compileApiExample', JavaCompile) {
    dependsOn tasks.named('jar')
    source fileTree("$rootDir/examples/api-addon-1.21.1") { include '**/*.java' }
    classpath = files(tasks.named('jar').flatMap { it.archiveFile }) + configurations.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('api-example-classes')
    javaCompiler = javaToolchains.compilerFor { languageVersion = java.toolchain.languageVersion }
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-proc:none']
}
